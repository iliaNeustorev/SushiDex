services:
    nginx:
        image: nginx:stable-alpine
        volumes:
            - .:/var/www
            - ./_docker/nginx/conf.d:/etc/nginx/conf.d
        ports:
            - "8859:80"
        restart: unless-stopped
        environment:
            TZ: "Europe/Moscow"
        depends_on:
            - app

    app:
        build:
            context: .
            dockerfile: _docker/app/php.Dockerfile
            args:
                UID: 1000
                GID: 1000
        volumes:
            - .:/var/www
        restart: unless-stopped
        environment:
            - TZ=Europe/Moscow


    db:
        image: postgres:17.6
        restart: always
        volumes:
            - ../pgdata:/var/lib/postgresql/data
        ports:
            - "127.0.0.1:5432:5432"
        environment:
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}

    node:
        build:
            context: .
            dockerfile: _docker/nodejs/node.Dockerfile
        working_dir: /var/www
        user: root
        volumes:
            - .:/var/www
            - node_modules:/var/www/node_modules
        ports:
            - "127.0.0.1:5173:5173"
        tty: true
        command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"

    redis:
        image: redis:7.4.2
        restart: always
        volumes:
            - redis_data:/data

volumes:
    redis_data:
    node_modules:
